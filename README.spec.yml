intro: |
  <a id="video"></a>
  The [10% challenge](https://github.com/DeusExperiments/ten-percent-challenge) asks for a model that is at most 10% of the size of a trained model, behaves the same as that model on an exam it never saw,
  and can learn from a few user corrections, all without training the weights. This repo is our working record: code, exams, results.

  Our task is 7-way voice-skill routing ("which skill should handle this request?") on a locked exam of {{ n.exam_n }} items. The model writes a real word as its answer (greedy decoding, exact string match; no multiple choice).
  A new label (for example `Recipe`) is taught from at most 25 corrections by a one-shot closed-form calculation that edits some **existing** weights: no head, adapter, lookup table or prompt.

  > **Status, as stated in the repo.** Filed entry: **L1**, [issue #2](https://github.com/DeusExperiments/ten-percent-challenge/issues/2). It passes all 9 judging rules **under our reading**; three of those passes rest on readings the maintainer has not ruled on.
  > Numbers below are read from the lanes' result files; nothing was re-run for this page.

video:
  url: ""
  caption: "Explainer video (voice-over and subtitles): the challenge, the two entries, and the numbers with their caveats"
  mp4: video/tenpct_explainer.mp4
  gif: video/preview.gif
  srt: video/tenpct_explainer.srt
  poster: video/poster.png
  out_dir: video/.render
  fps: 24
  max_mb: 22
  render_crf: 18
  poster_at: 40
  music: true
  voice: {engine: openai, voice: alloy, model: gpt-4o-mini-tts, tempo: 1.2}
  scenes:
    - type: title
      title: "The 10% challenge"
      subtitle: "Our attempt: small, faithful, and teachable"
      chips: [under 10% of fp16, locked exam, 25 annotations]
      say: "The ten percent challenge. Our attempt to shrink a trained model below ten percent of its size, keep its behaviour on an exam it never saw, and teach it a new label from a few corrections."
    - type: problem
      heading: "What the challenge asks"
      bullets:
        - "At most 10% of the model's fp16 size, every shipped byte counted"
        - "Behave like the original on an unseen exam"
        - "Learn from a few user corrections"
        - "No weight training, no new heads or side memory"
      say: "The challenge asks for a model at most ten percent of the original size, counting every shipped byte. It must behave the same as the original on an exam it never saw. And it must learn from a few user corrections, without training its weights, and without a new head or side memory."
    - type: architecture
      diagram: flow
      heading: "Our pipeline"
      say: "We start from a trained model and compress it without weight training, giving a packed artifact under ten percent of fp16. An answer command writes a skill word by greedy generation. A feedback command takes at most twenty five annotations and computes replacement values for existing tensors. The grown model is the same files plus that patch, and a locked exam, sealed by hash, is scored once."
    - type: chart
      chart: sizes
      say: "Size. Our filed entry L1 is {{ n.l1_size.numtext }} percent of Qwen three eight B in fp sixteen, with the patch, code and calibration prompts counted. The alternate L9b, a pruned three bit Qwen three point five thirty five B A three B, is {{ n.l9_size.numtext }} percent with its feedback carrier. The limit is ten."
    - type: chart
      chart: l1_ctl
      say: "Feedback on L1. Twenty five annotations teach the new label Recipe to {{ n.l1_teach.numtext }} percent of a locked set of {{ n.teach_n.numtext }} unseen requests, through the shipped commands. Neighbouring labels stay at {{ n.l1_neigh.numtext }} percent. Shuffled labels, wrong labels and empty feedback all teach zero."
    - type: chart
      chart: l9_ctl
      say: "The alternate L9b. Over eight draws, real feedback teaches {{ n.l9_teach.numtext }} percent on average, while shuffled labels average {{ n.l9_shuf.numtext }} percent, with some draws up to {{ n.l9_shuf_max.numtext }}. Retention against the original model is {{ n.l9_ret_min.numtext }} to {{ n.l9_ret_max.numtext }} percent across three quantizer draws."
    - type: results
      heading: "L1 at a glance"
      items:
        - {label: "size, % of fp16", number: l1_size}
        - {label: "teach new label", number: l1_teach}
        - {label: "neighbours kept", number: l1_neigh}
      say: "L1 at a glance: {{ n.l1_size.numtext }} percent of the size, {{ n.l1_teach.numtext }} percent teach on the new label, and {{ n.l1_neigh.numtext }} percent of neighbouring items kept."
    - type: caveats
      heading: "Honest caveats"
      bullets:
        - "The exam is ours, not the maintainer's"
        - "L1 starts from a released 1-bit model; compression is its makers' work"
        - "Three passes rest on readings nobody has ruled on"
        - "One narrow task with seven labels"
      say: "Caveats. The exam is ours, not the maintainer's. L1 starts from a released one bit model, so the compression is its makers' work. Three of the nine passes rest on readings the maintainer has not ruled on. And the task is one narrow task with seven labels."
    - type: end
      title: "The 10% challenge"
      subtitle: "Reports, manifests and raw results are in the repo"
      say: "Reports, manifests and raw results are in the repo."

